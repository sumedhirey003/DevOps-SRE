apiVersion: v1
kind: ServiceAccount
metadata:
  name: devops-sre-app
  namespace: devops-sre
automountServiceAccountToken: false

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devops-sre-app
  namespace: devops-sre
rules: []

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devops-sre-app
  namespace: devops-sre
subjects:
  - kind: ServiceAccount
    name: devops-sre-app
    namespace: devops-sre
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: devops-sre-app
