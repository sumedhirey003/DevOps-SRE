##DEPLOYMENT 1
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-sre-py311
  namespace: devops-sre
  labels:
    app.kubernetes.io/name: devops-sre
    app.kubernetes.io/version: py311
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: devops-sre
      app.kubernetes.io/version: py311
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devops-sre
        app.kubernetes.io/version: py311
    spec:
      serviceAccountName: devops-sre-app
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 5
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: config-preflight
          image: busybox:1.36.1
          command: ["sh", "-c"]
          args:
            - "test -s /config/APP_NAME && test -s /secret/APP_SECRET && echo 'Configuration and Secret verified'"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          volumeMounts:
            - name: app-config
              mountPath: /config
              readOnly: true
            - name: app-secret
              mountPath: /secret
              readOnly: true
      containers:
        - name: app
          image: ghcr.io/sumedhirey003/devops-sre:py311-pending
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: devops-sre-config
            - secretRef:
                name: devops-sre-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 400Mi
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: app-config
          configMap:
            name: devops-sre-config
        - name: app-secret
          secret:
            secretName: devops-sre-secret


