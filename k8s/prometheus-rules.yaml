apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: devops-sre-alerts
  namespace: devops-sre
  labels:
    release: monitoring
    app: devops-sre
spec:
  groups:
    - name: devops-sre.application
      rules:
        # Alert when application memory exceeds 60%
        # of its configured 400Mi limit.
        - alert: DevOpsSREHighMemoryUsage
          expr: |
            (
              max by (namespace, pod, container) (
                container_memory_working_set_bytes{
                  namespace="devops-sre",
                  container="app"
                }
              )
              /
              on(namespace, pod, container)
              max by (namespace, pod, container) (
                kube_pod_container_resource_limits{
                  namespace="devops-sre",
                  container="app",
                  resource="memory"
                }
              )
            ) > 0.60
          labels:
            severity: warning
          annotations:
            summary: "High memory usage in {{ $labels.pod }}"
            description: "Application memory usage is above 60% of its configured limit. Current ratio: {{ $value }}"

        # Alert when a container restarts at least twice
        # within five minutes.
        - alert: DevOpsSREFrequentRestarts
          expr: |
            increase(
              kube_pod_container_status_restarts_total{
                namespace="devops-sre",
                container="app"
              }[5m]
            ) >= 2
          labels:
            severity: critical
          annotations:
            summary: "Frequent restarts in {{ $labels.pod }}"
            description: "The application container has restarted at least twice within five minutes."

        # Detect containers whose most recent termination
        # reason was OOMKilled.
        - alert: DevOpsSREContainerOOMKilled
          expr: |
            kube_pod_container_status_last_terminated_reason{
              namespace="devops-sre",
              container="app",
              reason="OOMKilled"
            } == 1
          labels:
            severity: critical
          annotations:
            summary: "OOMKilled: {{ $labels.pod }}"
            description: "The application container was terminated because it exceeded its available memory."
