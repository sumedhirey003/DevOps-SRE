apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: devops-sre
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/sumedhirey003/DevOps-SRE.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: devops-sre

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true

    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
