name: PR Security Check

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-security-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python Tests, Lint and SAST
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install development tools
        run: python -m pip install pytest flake8 bandit

      - name: Run assessment tests
        run: python -m pytest -q

      - name: Run Flake8
        run: python -m flake8 app test --max-line-length=100

      - name: Run Bandit SAST
        run: python -m bandit -r app -s B104

  secret_scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Git history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  image_build_scan:
    name: Build and Scan Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    env:
      IMAGE_TAG: "devops-sre:ci-py${{ matrix.python-version }}"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: |
          docker build --pull \
            --build-arg PYTHON_VERSION="${{ matrix.python-version }}" \
            -t "$IMAGE_TAG" .

      - name: Verify non-root container user
        shell: bash
        run: |
          actual_user=$(docker image inspect "$IMAGE_TAG" \
            --format '{{.Config.User}}')

          echo "Configured container user: $actual_user"
          test "$actual_user" = "10001:10001"

      - name: Test container health endpoint
        shell: bash
        run: |
          docker run -d \
            --name app-health-test \
            -p 127.0.0.1:8080:8080 \
            "$IMAGE_TAG"

          healthy=0

          for attempt in $(seq 1 30); do
            if curl --fail --silent \
              http://127.0.0.1:8080/healthcheck; then
              healthy=1
              break
            fi
            sleep 1
          done

          echo
          docker logs app-health-test || true
          docker rm -f app-health-test

          if [ "$healthy" -ne 1 ]; then
            echo "Container health endpoint failed."
            exit 1
          fi

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_TAG }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

  required_gate:
    name: Required PR Gate
    if: always()
    needs:
      - quality
      - secret_scan
      - image_build_scan
    runs-on: ubuntu-latest

    steps:
      - name: Verify all checks passed
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          SECRET_RESULT: ${{ needs.secret_scan.result }}
          IMAGE_RESULT: ${{ needs.image_build_scan.result }}
        shell: bash
        run: |
          if [[ "$QUALITY_RESULT" != "success" ||
                "$SECRET_RESULT" != "success" ||
                "$IMAGE_RESULT" != "success" ]]; then
            echo "One or more required PR checks failed."
            exit 1
          fi

          echo "All required PR checks passed."
