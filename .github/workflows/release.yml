name: Release Pipeline

on:
  push:
    branches:
      - main
    # Prevent an image-tag update PR from triggering another release.
    paths-ignore:
      - "k8s/deployments.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/sumedhirey003/devops-sre

jobs:
  build-and-push:
    name: Build and Publish Python ${{ matrix.python-version }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            image-tag: "py311"
          - python-version: "3.12"
            image-tag: "py312"
          - python-version: "3.13"
            image-tag: "py313"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            PYTHON_VERSION=${{ matrix.python-version }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ matrix.image-tag }}-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  update-manifests:
    name: Create GitOps Image Update PR
    if: github.ref == 'refs/heads/main'
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v7.0.1
        with:
          ref: main

      - name: Update Kubernetes image tags
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          manifest = Path("k8s/deployments.yaml")
          content = manifest.read_text(encoding="utf-8")

          image_name = os.environ["IMAGE_NAME"]
          image_tag = os.environ["IMAGE_TAG"]

          for version in ("311", "312", "313"):
              pattern = (
                  rf"(image:\s*{re.escape(image_name)}:py{version}-)[^\s]+"
              )

              content, count = re.subn(
                  pattern,
                  rf"\g<1>{image_tag}",
                  content,
              )

              if count != 1:
                  raise SystemExit(
                      f"Expected exactly one Python {version} image, "
                      f"but found {count}."
                  )

              print(f"Updated Python {version} image tag.")

          manifest.write_text(content, encoding="utf-8")
          PY

      - name: Create image update pull request
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ secrets.RELEASE_PR_TOKEN }}
          branch: automation/update-k8s-image-tags
          delete-branch: true
          add-paths: k8s/deployments.yaml
          commit-message: "chore(gitops): update Kubernetes image tags"
          title: "chore(gitops): update Kubernetes image tags"
          body: |
            ## Automated GitOps image update

            This PR updates the three Kubernetes Deployments
            with images published by the release pipeline.

            All images use the same source commit SHA:

            `${{ github.sha }}`

            - Python 3.11
            - Python 3.12
            - Python 3.13

            Please review the changes and merge after
            the required PR security checks pass.
          base: main
